category: web
tools:
  - name: playwright-cli
    description: Headless Chromium automation through @playwright/cli, with snapshots, screenshots, form interaction, and isolated named sessions.
    path: tools/playwright-cli
    exec: playwright-cli
    tags: [browser, playwright, javascript, web, screenshot]
    when_to_use: Use when a page needs a real browser, JavaScript execution, or a visual snapshot. Name a session per project/member, keep it short-lived, and run "playwright-cli -s=<project>-<member> close" when finished.
  - name: sqlmap
    description: Automatic SQL injection detection and database takeover tool.
    path: tools/sqlmap/sqlmapproject-sqlmap-03be590
    exec: python sqlmap.py
    tags: [sqli, injection, database, web]
    when_to_use: Login bypass, data exfiltration, or any parameter suspected of SQL injection.
  - name: commix
    description: Automated command injection exploitation tool.
    path: tools/commix
    exec: python commix.py
    tags: [command-injection, rce, web]
    when_to_use: Parameter reflected into a shell command; OS command injection.
  - name: flask-pin
    description: Generate a Werkzeug debugger PIN or forge a Flask session from leaked machine data.
    path: tools/Flask-cookie-generation-based-on-PIN-code-main
    exec: python get_flask_pin_and_cookie.py
    tags: [flask, werkzeug, pin, session, web]
    when_to_use: Werkzeug console PIN bypass when machine-id and module paths leak.

  - name: whatweb
    description: Identify web technologies, CMS, frameworks and server banners on a target.
    path: /usr/bin/whatweb
    exec: whatweb
    tags: [recon, fingerprint, web, cms]
    when_to_use: First step against an unknown web target to fingerprint the stack before choosing an exploit class. Stay on authorized hosts and keep --max-threads low.
  - name: wafw00f
    description: Detect and identify the web application firewall protecting a target.
    path: /usr/local/bin/wafw00f
    exec: wafw00f
    tags: [recon, waf, web, fingerprint]
    when_to_use: Ask whether a WAF explains blocked payloads before changing an exploit. A negative result is weak evidence, not proof that no WAF exists.
  - name: nikto
    description: Web server and CGI misconfiguration scanner with a broad signature database.
    path: /usr/bin/nikto
    exec: nikto
    tags: [web, scanner, misconfiguration, cve]
    when_to_use: Enumerate known server-level issues after fingerprinting. It is noisy and slow, so cap it with -maxtime and keep it scoped to the authorized host.
  - name: nuclei
    description: Template-driven vulnerability scanner for known CVEs and misconfigurations.
    path: /usr/local/bin/nuclei
    exec: nuclei
    tags: [web, scanner, cve, templates]
    when_to_use: Run targeted templates (-tags cve, or -t /root/nuclei-templates/http/cves) once a technology and version are known. The template tree is baked into the image at /root/nuclei-templates; never rely on a runtime download.
  - name: ffuf
    description: Fast web fuzzer for directories, parameters, vhosts and headers.
    path: /usr/local/bin/ffuf
    exec: ffuf
    tags: [web, fuzzing, directory, brute-force]
    when_to_use: Content and parameter discovery with an explicit wordlist from /workspace/wordlists. Set -rate and -t explicitly; an unthrottled run can knock over a fragile challenge service.
  - name: feroxbuster
    description: Recursive content discovery scanner with automatic link extraction.
    path: /usr/local/bin/feroxbuster
    exec: feroxbuster
    tags: [web, fuzzing, directory, recursive]
    when_to_use: Recursive directory discovery when the site links to itself. Prefer --no-recursion with -t 10 when the target is fragile or rate limited.
  - name: gobuster
    description: Directory, DNS and vhost brute-forcer written in Go.
    path: /usr/local/bin/gobuster
    exec: gobuster
    tags: [web, fuzzing, directory, dns, vhost]
    when_to_use: Directory or vhost discovery; use dns mode only against a domain inside the authorized scope. Always pass -t to bound concurrency.
  - name: dirb
    description: Classic recursive web content scanner with built-in wordlists.
    path: /usr/bin/dirb
    exec: dirb
    tags: [web, fuzzing, directory]
    when_to_use: Fast first pass when ffuf/feroxbuster need a wordlist you do not have. Its default wordlists are small, so treat an empty result as inconclusive.
  - name: wfuzz
    description: Generic HTTP fuzzer for payloads, parameter names and response filtering.
    path: /usr/local/bin/wfuzz
    exec: wfuzz
    tags: [web, fuzzing, payload, filter]
    when_to_use: When ffuf cannot express the filter or payload (complex --hs/--hc logic, nested iterators). Bound it with --reqdelay and a small payload set.
  - name: sslscan
    description: Query TLS services for protocol versions, cipher suites and certificate details.
    path: /usr/bin/sslscan
    exec: sslscan
    tags: [tls, ssl, crypto, recon, web]
    when_to_use: Verify weak TLS configuration or extract certificate names for vhost discovery. It is read-only and safe to run against an authorized endpoint.
