category: misc
tools:
  - name: binwalk
    description: Firmware/embedded file extraction and analysis.
    path: system
    exec: binwalk
    tags: [forensics, extraction, misc]
    when_to_use: Carve embedded files from blobs/firmware/images.
  - name: foremost
    description: File carving by header/footer signatures.
    path: system
    exec: foremost
    tags: [forensics, carving, recovery, misc]
    when_to_use: Recover files from disk images or blobs when binwalk signatures miss or when you need a clean output directory per file type.
  - name: steghide
    description: Hide/extract data in JPEG/BMP/WAV.
    path: system
    exec: steghide
    tags: [stego, misc]
    when_to_use: Suspected steghide-embedded data in media.
  - name: zsteg
    description: PNG/BMP LSB steganography detector.
    path: system
    exec: zsteg
    tags: [stego, png, misc]
    when_to_use: PNG/BMP LSB and bit-plane steganography.
  - name: exiftool
    description: Read/write file metadata.
    path: system
    exec: exiftool
    tags: [metadata, forensics, misc]
    when_to_use: Inspect EXIF/metadata for hidden info.
  - name: volatility3
    description: Memory forensics framework.
    path: system
    exec: vol
    tags: [memory, forensics, misc]
    when_to_use: Analyze RAM dumps for processes, secrets, artifacts.
  - name: ysoserial
    description: Generate Java deserialization gadget payloads.
    path: /workspace/tools/ysoserial-master
    exec: java -jar /workspace/tools/ysoserial-master/ysoserial.jar
    tags: [java, deserialization, gadget, misc]
    when_to_use: Build Java deser payloads (also useful for web/pwn).
  - name: tshark
    description: Wireshark CLI for packet capture analysis and live capture; tcpdump is installed as a lightweight alternative.
    path: system
    exec: tshark
    tags: [pcap, network, tshark, tcpdump, forensics, misc]
    when_to_use: Read a provided pcap, filter conversations, extract HTTP/DNS/TLS metadata, or capture localhost traffic with tcpdump first.
