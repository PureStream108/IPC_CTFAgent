groups:
  tools: 工具
  tools/core: 核心命令行工具
  tools/web: Web
  tools/pwn: Pwn
  tools/reverse: Reverse
  tools/crypto: Crypto
  tools/misc: Misc / Forensics
  tools/ai: AI
  tools/osint: OSINT
  mcps: MCP 服务
  languages: 语言与运行时
  languages/bash: Bash / Shell
  languages/python: Python
  languages/java: Java
  languages/php: PHP
  languages/nodejs: JavaScript / Node.js
  languages/ruby: Ruby
  libraries: 语言库
  libraries/python: Python 库
  libraries/ruby: Ruby 库

entries:
  - id: core_bash
    kind: language
    group: languages/bash
    title: Bash / Shell
    summary: 用于组合命令、处理文件、编写自动化探测与复现脚本。
    tags: [bash, shell, automation]
    command: bash
    install_path: /bin/bash
    workflow: 使用 set -euo pipefail、明确引用变量，并把复杂流程保存为可复现脚本。
    example: "bash -lc 'file ./challenge && strings ./challenge | head'"
    official: https://www.gnu.org/software/bash/manual/
  - id: lang_python
    kind: language
    group: languages/python
    title: Python 3
    summary: 主要解题语言，用于漏洞利用、密码学、数据处理、自动化和 MCP 服务。
    tags: [python, pip, venv]
    command: python3
    install_path: /usr/bin/python3
    workflow: 优先在当前 Member 目录创建脚本，使用 python3 -m pip 查看可用包。
    example: "python3 -c \"import sys; print(sys.version)\""
    official: https://docs.python.org/3/
  - id: lang_java
    kind: language
    group: languages/java
    title: Java 21 / Maven
    summary: 用于 Java 题目、反序列化分析、JAR 工程和 Maven 依赖构建。
    tags: [java, javac, maven, jdk, deserialization]
    command: java
    install_path: /opt/java21、/opt/maven/bin/mvn
    workflow: 使用 javac 编译单文件，使用 Maven 构建依赖工程，并确认 JAVA_HOME=/opt/java21；反编译使用 r2/gdb/objdump，而不是已移除的 Ghidra。
    example: "java -version && javac -version && mvn -version"
    official: https://docs.oracle.com/en/java/javase/21/
  - id: lang_php
    kind: language
    group: languages/php
    title: PHP CLI
    summary: 用于运行、调试和复现 PHP Web 题目及序列化行为。
    tags: [php, web]
    command: php
    install_path: /usr/bin/php
    example: "php -r 'echo PHP_VERSION, PHP_EOL;'"
    official: https://www.php.net/manual/
  - id: lang_nodejs
    kind: language
    group: languages/nodejs
    title: JavaScript / Node.js
    summary: 用于运行 Node.js 题目、审计 npm 项目和编写 JavaScript 探针。
    tags: [javascript, nodejs, npm]
    command: node
    install_path: /usr/local/bin/node（Node 22.23.4）
    workflow: 官方 Node 22 安装在 /usr/local；npm 全局目录随 Node 版本管理。CLI 与题目脚本都从 current PATH 调用 node/npm。
    example: "node --version && npm --version"
    official: https://nodejs.org/docs/latest/api/
  - id: lang_ruby
    kind: language
    group: languages/ruby
    title: Ruby / Gem
    summary: 用于运行 Ruby 脚本以及 one_gadget、zsteg 等解题工具。
    tags: [ruby, gem]
    command: ruby
    install_path: /usr/bin/ruby
    example: "ruby --version && gem --version"
    official: https://docs.ruby-lang.org/

  - id: mcp_memory
    kind: mcp
    group: mcps
    title: Memory MCP
    summary: 检索当前运行期经验和只读的预装工具知识目录。
    tags: [mcp, memory, knowledge]
    command: ipc-mcp-server memory
    install_path: backend/memory/memory_mcp.py
    workflow: 先 memory_search，再用 memory_get 读取经验或 memory_doc 打开工具文档。
    example: "ipc-mcp-server memory --transport stdio"
  - id: mcp_tool_search
    kind: mcp
    group: mcps
    title: tool_search MCP
    summary: 跨题型搜索完整工具注册表并返回调用方法和适用场景。
    tags: [mcp, tools, search]
    command: ipc-mcp-server tool_search
    install_path: backend/tools/tool_mcp.py
    example: "ipc-mcp-server tool_search --transport stdio"
  - id: mcp_tools
    kind: mcp
    group: mcps
    title: tools MCP
    summary: 按题型列出当前 Member 已暴露的工具及其执行入口。
    tags: [mcp, category, tools]
    command: ipc-mcp-server tools
    install_path: backend/tools/tool_mcp.py
    example: "ipc-mcp-server tools --category pwn --transport stdio"
  - id: core_ripgrep
    kind: tool
    group: tools/core
    title: ripgrep
    summary: 在源码、配置和日志中快速递归搜索文本与正则表达式。
    tags: [rg, search, source]
    command: rg
    install_path: /usr/bin/rg
    example: "rg -n 'flag|password|secret' ."
    official: https://github.com/BurntSushi/ripgrep
  - id: core_git
    kind: tool
    group: tools/core
    title: Git
    summary: 检查源码历史、差异、分支和公开辅助工具仓库。
    tags: [git, source, history]
    command: git
    install_path: /usr/bin/git
    example: "git log --oneline --all && git diff"
    official: https://git-scm.com/docs
  - id: core_jq
    kind: tool
    group: tools/core
    title: jq
    summary: 查询、筛选和变换 JSON API 响应与日志记录。
    tags: [json, cli]
    command: jq
    install_path: /usr/bin/jq
    example: "jq -r '.items[]?.id' response.json"
    official: https://jqlang.github.io/jq/manual/
  - id: core_archives
    kind: tool
    group: tools/core
    title: zip / unzip
    summary: 检查、解压和重新打包 ZIP 类题目附件。
    tags: [zip, archive]
    command: unzip
    install_path: /usr/bin/unzip
    example: "unzip -l attachment.zip && unzip attachment.zip -d extracted"
  - id: core_file_triage
    kind: tool
    group: tools/core
    title: file / xxd / hexdump
    summary: 识别文件格式并查看魔数、头部和原始十六进制数据。
    tags: [file, xxd, hex, triage]
    command: file
    install_path: /usr/bin/file
    example: "file challenge && xxd -l 128 challenge"
  - id: core_build
    kind: tool
    group: tools/core
    title: GCC / G++ / Make / Musl / CMake
    summary: 编译题目源码、利用程序和本地复现所需的原生辅助代码，并用 musl-gcc 生成静态二进制。
    tags: [gcc, g++, make, musl, cmake, build]
    command: gcc
    install_path: /usr/bin/gcc、/usr/bin/musl-gcc
    workflow: 动态链接程序直接用 gcc/g++ 编译；需要跨环境搬运的利用程序用 musl-gcc -static。make/cmake 用于题目自带构建系统。
    example: "gcc -O0 -g -o sample sample.c && musl-gcc -static -O2 -o sample-static sample.c"
  - id: core_netcat
    kind: tool
    group: tools/core
    title: netcat
    summary: 建立原始 TCP 连接、发送协议数据并创建临时监听端口。
    tags: [nc, tcp, network]
    command: nc
    install_path: /usr/bin/nc
    example: "nc -nv target 31337"
  - id: core_media
    kind: tool
    group: tools/core
    title: ffmpeg / sox
    summary: 提取音视频流、拆分声道并生成音频分析素材。
    tags: [ffmpeg, sox, audio, video]
    command: ffmpeg
    install_path: /usr/bin/ffmpeg
    example: "ffmpeg -i input.mp4 -vn audio.wav && sox audio.wav -n spectrogram"
  - id: core_imagemagick
    kind: tool
    group: tools/core
    title: ImageMagick
    summary: 检查和转换图片、分离通道并执行基础图像处理。
    tags: [image, identify, convert]
    command: identify
    install_path: /usr/bin/identify
    example: "identify -verbose image.png"
  - id: core_tesseract
    kind: tool
    group: tools/core
    title: Tesseract OCR
    summary: 从截图、扫描件和题目图片中提取可搜索文本。
    tags: [ocr, image, tesseract]
    command: tesseract
    install_path: /usr/bin/tesseract
    example: "tesseract image.png stdout -l eng"
  - id: core_pngcheck
    kind: tool
    group: tools/core
    title: pngcheck
    summary: 验证 PNG 数据块、定位损坏结构和异常附加数据。
    tags: [png, image, forensic]
    command: pngcheck
    install_path: /usr/bin/pngcheck
    example: "pngcheck -vt image.png"

  - id: tool_curl
    kind: tool
    group: tools/osint
    parents: [tools/core]
    title: curl
    summary: 使用 curl 或 wget 发起 HTTP 请求、下载附件并检查响应头、重定向和 API 数据。
    tags: [http, download, curl, wget, core, osint]
    command: curl
    install_path: /usr/bin/curl 与 /usr/bin/wget
    workflow: curl 适合可重复的协议探测和 API 请求，wget 适合递归或断点下载；敏感认证头只放在当前命令中。
    example: "curl -iL https://example.com/ && wget -O attachment.bin https://example.com/attachment.bin"
    official: https://curl.se/docs/

  - id: tool_objdump
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: objdump
    summary: 使用 Binutils 的 objdump、readelf、nm 和 strip 检查 ELF 头、符号、段、重定位与反汇编。
    tags: [binutils, objdump, readelf, nm, strip, elf, reverse]
    command: objdump
    install_path: /usr/bin/objdump、/usr/bin/readelf、/usr/bin/nm、/usr/bin/strip
    workflow: 先用 readelf/file 确认架构和段，再用 nm/objdump 定位符号与代码；除副本外不要对题目原件执行 strip。
    example: "readelf -hW challenge && nm -an challenge | head && objdump -d -M intel challenge | head -80"
    official: https://sourceware.org/binutils/docs/

  - id: lib_pwntools
    kind: library
    group: libraries/python
    title: pwntools
    summary: 提供进程/网络交互、打包、ELF、ROP 和 shellcode 的漏洞利用框架。
    tags: [python, pwn, elf, rop]
    command: "python3 -c \"import pwnlib; print(pwnlib.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"from pwn import *; print(p64(0x41414141))\""
    official: https://docs.pwntools.com/
  - id: lib_pycryptodome
    kind: library
    group: libraries/python
    title: PyCryptodome
    summary: 提供 AES、RSA、哈希、随机数和常用密码学原语。
    tags: [python, crypto, aes, rsa]
    command: "python3 -c \"import Crypto; print(Crypto.__version__)\""
    install_path: Python site-packages/Crypto
    example: "python3 -c \"from Crypto.Util.number import long_to_bytes; print(long_to_bytes(0x666c6167))\""
    official: https://pycryptodome.readthedocs.io/
  - id: lib_math
    kind: library
    group: libraries/python
    title: SymPy / gmpy2 / fpylll
    summary: 用于符号运算、大整数、数论、格基约化和密码攻击脚本。
    tags: [python, math, crypto, lll]
    command: "python3 -c \"import sympy,gmpy2,fpylll; print(sympy.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"from sympy.ntheory.modular import crt; print(crt([3,5],[2,3]))\""
  - id: lib_z3
    kind: library
    group: libraries/python
    title: z3-solver
    summary: 用 SMT 约束求解整数、位向量、逻辑条件和程序路径。
    tags: [python, z3, smt, constraint]
    command: "python3 -c \"import z3; print(z3.get_version_string())\""
    install_path: Python site-packages/z3
    example: "python3 -c \"from z3 import *; x=Int('x'); s=Solver(); s.add(x*x==49,x>0); print(s.check(),s.model())\""
    official: https://z3prover.github.io/api/html/namespacez3py.html
  - id: lib_web_python
    kind: library
    group: libraries/python
    title: Requests / Flask / PyJWT / jwcrypto / Jinja2
    summary: 用于 HTTP 请求、本地 Web 复现、JWT/JWS/JWE 分析和模板注入研究。
    tags: [python, web, requests, flask, jwt, jwcrypto, jinja2]
    command: 'python3 -c "import requests,flask,jwt,jwcrypto,jinja2; print(jwt.__version__)"'
    install_path: Python site-packages
    workflow: PyJWT 负责 JWT 编解码与签名校验，jwcrypto 负责 JWS/JWE 与 JWK；测试 alg=none、弱密钥和 kid 注入时先在本地脚本验证，再发给目标。
    example: 'python3 -c "import jwt; print(jwt.encode({\"sub\":\"alice\"}, \"secret\", algorithm=\"HS256\"))"'
    related: [lib_jwt]
  - id: lib_numpy_scipy
    kind: library
    group: libraries/python
    title: NumPy / SciPy
    summary: 用于数组、数值计算、信号处理、频域分析和 AI 数据预处理。
    tags: [python, numpy, scipy, signal]
    command: "python3 -c \"import numpy,scipy; print(numpy.__version__,scipy.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"import numpy as np; print(np.fft.fft([1,0,1,0]))\""
    official: https://numpy.org/doc/
  - id: lib_images
    kind: library
    group: libraries/python
    title: Pillow / pytesseract
    summary: 用 Python 读取、变换图片并调用 Tesseract 完成 OCR。
    tags: [python, pillow, ocr, image]
    command: "python3 -c \"import PIL,pytesseract; print(PIL.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"from PIL import Image; print(Image.open('image.png').size)\""
    official: https://pillow.readthedocs.io/
  - id: lib_angr
    kind: library
    group: libraries/python
    title: angr
    summary: 对二进制执行符号执行、CFG 恢复和路径约束求解。
    tags: [python, reverse, symbolic, angr]
    command: "python3 -c \"import angr; print(angr.__version__)\""
    install_path: Python site-packages/angr
    example: "python3 -c \"import angr; p=angr.Project('./challenge',auto_load_libs=False); print(p.entry)\""
    official: https://docs.angr.io/
  - id: lib_emulation
    kind: library
    group: libraries/python
    title: Capstone / Unicorn
    summary: 提供多架构反汇编和 CPU 指令级仿真能力。
    tags: [python, capstone, unicorn, reverse]
    command: "python3 -c \"import capstone,unicorn; print(capstone.__version__,unicorn.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"from capstone import *; print(next(Cs(CS_ARCH_X86,CS_MODE_64).disasm(b'\\\\x90',0x1000)).mnemonic)\""
  - id: lib_volatility3
    kind: library
    group: libraries/python
    title: Volatility 3
    summary: 分析内存镜像中的进程、模块、网络连接和恶意活动痕迹。
    tags: [python, memory, forensics, volatility]
    command: python3 -m volatility3
    install_path: Python site-packages/volatility3
    example: "python3 -m volatility3 -f memory.raw windows.info"
    official: https://volatility3.readthedocs.io/
  - id: lib_torch
    kind: library
    group: libraries/python
    title: PyTorch
    summary: 在 CPU 上加载和检查神经网络模型、张量与 AI 题目数据。
    tags: [python, ai, torch]
    command: "python3 -c \"import torch; print(torch.__version__)\""
    install_path: Python site-packages/torch
    example: "python3 -c \"import torch; print(torch.load('model.pt',map_location='cpu',weights_only=False))\""
    official: https://pytorch.org/docs/stable/
  - id: lib_keras
    kind: library
    group: libraries/python
    title: Keras / h5py
    summary: 加载 Keras/HDF5 模型并检查层结构、权重和输入输出。
    tags: [python, ai, keras, h5py]
    command: "python3 -c \"import keras,h5py; print(keras.__version__)\""
    install_path: Python site-packages
    example: "python3 -c \"import h5py; f=h5py.File('model.h5'); print(list(f.keys()))\""
    official: https://keras.io/api/
  - id: lib_r2pipe
    kind: library
    group: libraries/python
    title: r2pipe
    summary: 从 Python 驱动 radare2 CLI 并获取文本或 JSON 分析结果。
    tags: [python, radare2, reverse, cli]
    command: "python3 -c \"import r2pipe; print(r2pipe)\""
    install_path: Python site-packages/r2pipe
    workflow: 用 r2pipe.open() 启动独立 r2 进程，执行 aaa/afl/pdf/izz 等命令；退出时调用 quit()，避免遗留 r2 进程。
    example: "python3 -c \"import r2pipe; r=r2pipe.open('./challenge'); print(r.cmd('aaa; afl')); r.quit()\""
    official: https://github.com/radareorg/radare2-r2pipe
  - id: lib_tqdm
    kind: library
    group: libraries/python
    title: tqdm
    summary: 为批量爆破、遍历和长时间数据处理显示进度。
    tags: [python, progress, automation]
    command: "python3 -c \"import tqdm; print(tqdm.__version__)\""
    install_path: Python site-packages/tqdm
    example: "python3 -c \"from tqdm import tqdm; [None for _ in tqdm(range(100))]\""
    official: https://tqdm.github.io/
  - id: core_wordlists
    kind: tool
    group: tools/core
    title: 常用字典
    summary: 预装 rockyou 与 SecLists 精选目录，供口令、目录和用户名爆破使用。
    tags: [wordlist, rockyou, seclists, brute-force, password]
    command: ls
    install_path: /opt/ipc-tools/wordlists、/workspace/wordlists
    workflow: 先用小字典验证流程，再换更大的列表；注意任务时限和账号锁定策略，避免无界爆破。
    example: "test -s /workspace/wordlists/rockyou.txt && wc -l /workspace/wordlists/SecLists/Discovery/Web-Content/common.txt"
    official: https://github.com/danielmiessler/SecLists
  - id: lib_jwt
    kind: library
    group: libraries/python
    title: PyJWT / jwcrypto
    summary: JWT 编解码、签名校验、JWS/JWE 与 JWK 操作。
    tags: [python, jwt, jws, jwe, jwk, web]
    command: 'python3 -c "import jwt; print(jwt.__version__)"'
    install_path: Python site-packages（PyJWT、jwcrypto）
    workflow: 先解析 header/payload 与算法，再验证密钥、kid、alg 混淆和 JWK 注入；不要用未校验的 decode 结果直接做授权判断。
    example: 'python3 -c "import jwt; print(jwt.decode(jwt.encode({\"a\":1}, \"k\", algorithm=\"HS256\"), \"k\", algorithms=[\"HS256\"]))"'
    related: [lib_web_python]
    official: https://pyjwt.readthedocs.io/
  - id: lib_scapy
    kind: library
    group: libraries/python
    title: Scapy / dpkt
    summary: 构造、解析和重放网络数据包，读取 pcap 并做协议层分析。
    tags: [python, pcap, packet, network, scapy, dpkt]
    command: 'python3 -c "import scapy, dpkt; print(scapy.__version__)"'
    install_path: Python site-packages
    workflow: 用 rdpcap 读取 pcap 后按协议分层过滤；需要重放或构造畸形包时使用 Scapy 的 layer 组合，并在容器内的 lo 接口测试。
    example: 'python3 -c "from scapy.all import rdpcap; print(len(rdpcap(\"capture.pcap\")))"'
    related: [tool_tshark]
    official: https://scapy.readthedocs.io/
  - id: tool_playwright_cli
    kind: tool
    group: tools/web
    parents: [tools/core]
    title: playwright-cli
    summary: 通过 @playwright/cli 按需启动无头 Chromium，执行页面打开、快照、截图和交互。
    tags: [browser, playwright, javascript, screenshot, web]
    command: playwright-cli
    install_path: /opt/ipc-tools/tools/playwright-cli/playwright-cli、/usr/local/bin/playwright-cli
    workflow: 为每个 project/member 使用唯一 -s 会话名；先 open，再 snapshot 或 screenshot，最后 close。CLI 空闲会退出，不存在常驻 Chrome 或 Browser MCP。
    example: "playwright-cli -s=demo-amber open http://127.0.0.1:8000 && playwright-cli -s=demo-amber snapshot && playwright-cli -s=demo-amber close"
    related: [tool_curl]
    official: https://playwright.dev/
  - id: tool_upx
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: upx
    summary: UPX 4.2.4 检测、压缩和解压可执行文件，固定使用 4.2.4 而不是旧版 upx-ucl。
    tags: [upx, packer, unpack, reverse, elf]
    command: upx
    install_path: /usr/local/bin/upx
    workflow: 先 upx -t 测试，再对副本执行 upx -d；压缩时保留原始备份，避免破坏题目附件。
    example: "upx -t ./challenge && cp ./challenge ./challenge.upx && upx -d ./challenge.upx -o ./challenge.unpacked"
    related: [tool_radare2, tool_objdump]
    official: https://upx.github.io/
  - id: tool_tshark
    kind: tool
    group: tools/misc
    parents: [tools/core]
    title: tshark
    summary: 用 tshark 解析 pcap，用 tcpdump 做轻量抓包和流量过滤。
    tags: [pcap, packet, network, tshark, tcpdump, forensics]
    command: tshark
    install_path: /usr/bin/tshark、/usr/bin/tcpdump
    workflow: 有 pcap 时先 tshark -r 读取协议层级和 HTTP/DNS 字段；需要现场抓包时用 tcpdump -i lo -w 写入，再用 tshark 读取。
    example: "tshark -r capture.pcap -Y http.request -T fields -e http.host -e http.request.uri | head"
    related: [lib_scapy, core_file_triage]
    official: https://www.wireshark.org/docs/man-pages/tshark.html
  - id: tool_strace
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: strace
    summary: 跟踪进程的系统调用、信号、文件与网络行为。
    tags: [strace, syscall, linux, dynamic-analysis, reverse]
    command: strace
    install_path: /usr/bin/strace
    workflow: 用 -f 跟随子进程，用 -e trace=file,network,process 缩小范围，把输出写到文件避免污染终端。
    example: "strace -f -e trace=execve,openat,connect -o /tmp/trace.log ./challenge"
    related: [tool_gdb, tool_strace]
    official: https://strace.io/
  - id: tool_gdbserver
    kind: tool
    group: tools/pwn
    parents: [tools/core]
    title: gdbserver
    summary: 在本地或容器内启动远程调试 stub，并用 gdb 连接。
    tags: [gdb, gdbserver, remote, debug, pwn]
    command: gdbserver
    install_path: /usr/bin/gdbserver
    workflow: 用 gdbserver 127.0.0.1:1234 ./target 启动，再在另一个进程运行 gdb -q ./target -ex 'target remote 127.0.0.1:1234'；调试结束关闭监听。
    example: "gdbserver 127.0.0.1:1234 ./challenge"
    related: [tool_gdb, tool_socat]
    official: https://sourceware.org/gdb/current/onlinedocs/gdb.html/Server.html
  - id: tool_foremost
    kind: tool
    group: tools/misc
    parents: [tools/core]
    title: foremost
    summary: 按文件头尾签名从磁盘镜像或二进制 blob 中 carving 文件。
    tags: [foremost, carving, forensics, recovery, misc]
    command: foremost
    install_path: /usr/bin/foremost
    workflow: 用 -i 指定输入、-o 指定空输出目录、-T 加时间戳；先看审计文件，再检查按类型分目录的结果。
    example: "foremost -i disk.img -o /tmp/foremost-out -T"
    related: [tool_binwalk]
    official: https://foremost.sourceforge.net/
  - id: tool_elfutils
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: elfutils
    summary: eu-readelf、eu-objdump、eu-nm、eu-stack 等 ELF/DWARF 工具。
    tags: [elfutils, elf, readelf, dwarf, reverse]
    command: eu-readelf
    install_path: /usr/bin/eu-readelf
    workflow: 用 eu-readelf -a 查看节、符号、重定位和注释；binutils readelf 失败时用 elfutils 做交叉验证。
    example: "eu-readelf -h -S -s ./challenge | head -120"
    related: [tool_objdump]
    official: https://sourceware.org/elfutils/
  - id: tool_socat
    kind: tool
    group: tools/pwn
    parents: [tools/core]
    title: socat
    summary: 通用 TCP/UDP/UNIX socket 与进程端点转发工具。
    tags: [socat, relay, tunnel, network, pwn]
    command: socat
    install_path: /usr/bin/socat
    workflow: 用 TCP-LISTEN 转发到本地服务，或用 EXEC 把程序暴露到端口；测试结束及时终止监听。
    example: "socat TCP-LISTEN:9000,reuseaddr,fork TCP:127.0.0.1:8000"
    related: [core_netcat, tool_gdbserver]
    official: http://www.dest-unreach.org/socat/doc/socat.html
  - id: tool_file
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: file
    summary: 根据魔数和结构识别文件类型、架构与容器格式。
    tags: [file, triage, magic, reverse]
    command: file
    install_path: /usr/bin/file
    workflow: 对未知附件先运行 file -k，再结合 xxd 和 binwalk 判断是否需要解包或反编译。
    example: "file -k ./challenge && file -k ./attachment.bin"
    related: [core_file_triage, tool_xxd]
    official: https://www.darwinsys.com/file/
  - id: tool_xxd
    kind: tool
    group: tools/reverse
    parents: [tools/core]
    title: xxd
    summary: 十六进制查看、偏移定位和 hex 反转。
    tags: [xxd, hex, binary, reverse]
    command: xxd
    install_path: /usr/bin/xxd
    workflow: 用 -l 限制长度、-s 跳转偏移、-r 把编辑后的 hex 还原；修改题目文件前先复制。
    example: "xxd -l 128 ./challenge && xxd -s 0x40 -l 64 ./challenge"
    related: [core_file_triage, tool_file]
    official: https://linux.die.net/man/1/xxd

  - id: lib_one_gadget
    kind: library
    group: libraries/ruby
    title: one_gadget
    summary: 枚举 libc 中满足特定约束即可触发 execve 的 one-shot gadget。
    tags: [ruby, pwn, libc]
    command: one_gadget
    install_path: Ruby gems
    example: "one_gadget ./libc.so.6"
    official: https://github.com/david942j/one_gadget
  - id: lib_zsteg
    kind: library
    group: libraries/ruby
    title: zsteg
    summary: 检测 PNG/BMP 中的 LSB、bit-plane 和隐藏数据。
    tags: [ruby, stego, png]
    command: zsteg
    install_path: Ruby gems
    example: "zsteg -a image.png"
    official: https://github.com/zed-0xff/zsteg
