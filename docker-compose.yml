services:
  ipc-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${IPC_POSTGRES_DB:-ipc}
      - POSTGRES_USER=${IPC_POSTGRES_USER:-ipc}
      - POSTGRES_PASSWORD=${IPC_POSTGRES_PASSWORD:-ipc}
    volumes:
      - ipc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ipc-task-image:
    build:
      context: .
      dockerfile: docker/member/Dockerfile
      args:
        GITHUB_MIRROR: ${IPC_GITHUB_MIRROR:-https://github.com}
        TEMURIN_JDK_URL: ${IPC_TEMURIN_JDK_URL:-https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse}
    image: ipc-task:latest
    command: ["true"]
    restart: "no"

  ipc-zap:
    profiles: ["zap"]
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    expose:
      - "8080"
    restart: unless-stopped

  ipc-claude-runner:
    build:
      context: .
      dockerfile: docker/claude-runner/Dockerfile
    image: ipc-claude-runner:latest
    container_name: ipc-claude-runner
    # Claude Code refuses bypass-permission mode as root. The supplemental
    # host Docker group still permits the dedicated host helper to use the
    # Docker socket without running the Claude process itself as root.
    user: "1000:1000"
    group_add:
      - "997"
    environment:
      - IPC_RUNNER_TOKEN=${IPC_RUNNER_TOKEN:-}
      - IPC_DATABASE_URL=${IPC_DATABASE_URL:-postgresql://ipc:ipc@ipc-postgres:5432/ipc}
      - IPC_RUNNER_PORT=8600
      - IPC_RUNNER_MAX_CONCURRENT=${IPC_RUNNER_MAX_CONCURRENT:-2}
      - IPC_IPC_MCP_URL=${IPC_IPC_MCP_URL:-http://ipc-app:8000/internal/mcp}
    expose:
      - "8600"
    working_dir: /data/ctf/IPC_CTFAgent
    volumes:
      # Keep the runner on the same absolute path so Docker Compose commands
      # it launches resolve against the host's project path.
      - ./:/data/ctf/IPC_CTFAgent
      # The runner can repair source and deployment files, but must not read or
      # modify persistent IPC conversations and workflow secrets by default.
      - ./data:/data/ctf/IPC_CTFAgent/data:ro
      # Claude Code's native JSONL sessions must survive runner replacement so
      # each IPC conversation can resume its real agent context with --resume.
      - ipc_claude_home:/home/node/.claude
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuse the host's Compose v2 plugin so the agent can rebuild/restart
      # ipc-app after source changes without rebuilding the task image.
      - /usr/libexec/docker/cli-plugins/docker-compose:/usr/libexec/docker/cli-plugins/docker-compose:ro
    restart: unless-stopped

  ipc-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipc-ctfagent:latest
    container_name: ipc-app
    ports:
      - "8000:8000"
    environment:
      - IPC_ROOT=/app
      - IPC_ARTIFACT_ROOT=/app/data/artifacts
      - IPC_LOG_ENABLED=true
      - IPC_ZAP_ENABLED=${IPC_ZAP_ENABLED:-}
      - IPC_CLAUDE_RUNNER_URL=${IPC_CLAUDE_RUNNER_URL:-http://ipc-claude-runner:8600}
      - IPC_RUNNER_TOKEN=${IPC_RUNNER_TOKEN:-}
      - IPC_DATABASE_URL=${IPC_DATABASE_URL:-postgresql://ipc:ipc@ipc-postgres:5432/ipc}
    volumes:
      # PostgreSQL owns runtime facts. ./data holds deployment-owned secrets,
      # IPC conversation files and the shared Artifact tree (workspaces,
      # attachments, logs, writeups and exports) across app replacements.
      - ./data:/app/data
      - ./backend/config:/app/backend/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      ipc-postgres:
        condition: service_healthy
      ipc-task-image:
        condition: service_completed_successfully
      ipc-claude-runner:
        condition: service_started

# Browser and reverse MCP servers run inside each task container. ZAP is an
# optional shared service enabled with the `zap` Compose profile.

volumes:
  ipc_claude_home:
  ipc_postgres_data:
