services:
  ipc-task-image:
    build:
      context: .
      dockerfile: docker/member/Dockerfile
    image: ipc-task:latest
    command: ["true"]
    restart: "no"

  ipc-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    expose:
      - "8080"
    restart: unless-stopped

  ipc-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipc-ctfagent:latest
    container_name: ipc-app
    ports:
      - "8000:8000"
    environment:
      - IPC_ROOT=/app
      - IPC_LOG_ENABLED=true
      - IPC_LOG_EXPORT_DIR=/app/exports/logs
      - IPC_WP_EXPORT_DIR=/app/exports/Wp
    volumes:
      - ipc_data:/app/data
      - ipc_memory:/app/memory
      - ipc_wp:/app/wp
      - ipc_runtime_logs:/app/logs
      - ipc_projects:/app/projects
      - ./logs:/app/exports/logs
      - ./Wp:/app/exports/Wp
      - ./backend/config:/app/backend/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - ipc-task-image
      - ipc-zap

# Browser and reverse MCP servers run inside each task container. ZAP remains a
# shared service on the Compose network and is reached by the task-side server.

volumes:
  ipc_data:
  ipc_memory:
  ipc_wp:
  ipc_runtime_logs:
  ipc_projects:
