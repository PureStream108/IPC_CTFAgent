services:
  ipc-postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${IPC_POSTGRES_DB:-ipc}
      - POSTGRES_USER=${IPC_POSTGRES_USER:-ipc}
      - POSTGRES_PASSWORD=${IPC_POSTGRES_PASSWORD:-ipc}
    volumes:
      - ipc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ipc-task-image:
    build:
      context: .
      dockerfile: docker/member/Dockerfile
      args:
        IPC_TASK_BASE: ${IPC_TASK_BASE:-ubuntu:22.04}
        GITHUB_MIRROR: ${IPC_GITHUB_MIRROR:-https://github.com}
        TEMURIN_JDK_URL: ${IPC_TEMURIN_JDK_URL:-https://api.adoptium.net/v3/binary/latest/21/ga/linux/x64/jdk/hotspot/normal/eclipse}
    image: ipc-task:latest
    command: ["true"]
    restart: "no"

  ipc-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipc-ctfagent:latest
    container_name: ipc-app
    ports:
      - "8000:8000"
    environment:
      - IPC_ROOT=/app
      - IPC_ARTIFACT_ROOT=/app/data/artifacts
      - IPC_LOG_ENABLED=true
      - IPC_DATABASE_URL=${IPC_DATABASE_URL:-postgresql://ipc:ipc@ipc-postgres:5432/ipc}
      # ret2shell platform credentials; when USERNAME (or TOKEN) is set the
      # backend registers the ret2shell MCP for every Member.
      - IPC_R2S_BASE_URL=${IPC_R2S_BASE_URL:-}
      - IPC_R2S_GAME_ID=${IPC_R2S_GAME_ID:-}
      - IPC_R2S_USERNAME=${IPC_R2S_USERNAME:-}
      - IPC_R2S_PASSWORD=${IPC_R2S_PASSWORD:-}
      - IPC_R2S_TOKEN=${IPC_R2S_TOKEN:-}
      # GZCTF participant cookie credentials are deployment secrets.  They are
      # read only by the backend adapter and are never copied into run specs.
      - IPC_GZ_BASE_URL=${IPC_GZ_BASE_URL:-}
      - IPC_GZ_TOKEN=${IPC_GZ_TOKEN:-}
      - IPC_GZ_USERNAME=${IPC_GZ_USERNAME:-}
      - IPC_GZ_PASSWORD=${IPC_GZ_PASSWORD:-}
      - IPC_GZ_GAME_ID=${IPC_GZ_GAME_ID:-}
    volumes:
      # PostgreSQL owns runtime facts. ./data holds deployment-owned secrets,
      # IPC conversation files and the shared Artifact tree (workspaces,
      # attachments, logs, writeups and exports) across app replacements.
      - ./data:/app/data
      - ./backend/config:/app/backend/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      ipc-postgres:
        condition: service_healthy
      ipc-task-image:
        condition: service_completed_successfully

# Browser and reverse MCP servers run inside each task container.

volumes:
  ipc_postgres_data:
