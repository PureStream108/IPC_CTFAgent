services:
  ipc-task-image:
    build:
      context: .
      dockerfile: docker/member/Dockerfile
    image: ipc-task:latest
    command: ["true"]
    restart: "no"

  ipc-zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.disablekey=true
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    expose:
      - "8080"
    restart: unless-stopped

  ipc-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ipc-ctfagent:latest
    container_name: ipc-app
    ports:
      - "8000:8000"
    environment:
      - IPC_ROOT=/app
      - IPC_LOG_ENABLED=true
      - IPC_LOG_EXPORT_DIR=/app/data/logs
      - IPC_WP_EXPORT_DIR=/app/data/Wp
      - IPC_MEMORY_EXPORT_DIR=/app/data/memory
    volumes:
      # ./data is the only persistent location: the UI's Derive/Export actions
      # write logs, WP and the memory vault here, and they survive
      # `docker compose down`. Operational state (blackboard, memory, tool
      # cache) is held in RAM and everything else the container writes is
      # ephemeral, so a fresh `up` starts clean.
      - ./data:/app/data
      - ./backend/config:/app/backend/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - ipc-task-image
      - ipc-zap

# Browser and reverse MCP servers run inside each task container. ZAP remains a
# shared service on the Compose network and is reached by the task-side server.
