name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipc_test
          POSTGRES_USER: ipc
          POSTGRES_PASSWORD: ipc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipc -d ipc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      IPC_TEST_DATABASE_URL: postgresql://ipc:ipc@127.0.0.1:5432/ipc_test
      IPC_DATABASE_URL: postgresql://ipc:ipc@127.0.0.1:5432/ipc_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docker]"

      - name: Run tests
        run: python -m pytest -q
