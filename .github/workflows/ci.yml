name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docker]"

      - name: Run lint and deployment checks
        run: |
          python -m ruff check backend scripts tests
          python -m compileall -q backend scripts tests
          python -m alembic upgrade head --sql > /tmp/ipc-migration.sql
          docker compose config --quiet
          docker compose -f docker-compose.e2e.yml config --quiet
          node tests/js/ops_chat_checks.mjs .
          node tests/js/pentest_checks.mjs .
          node tests/js/wp_viewer_checks.mjs .
          python scripts/check_workflow_package.py
          python scripts/check_toolchain_sync.py
          python scripts/generate_catalog_docs.py --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipc_test
          POSTGRES_USER: ipc
          POSTGRES_PASSWORD: ipc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipc -d ipc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      IPC_TEST_DATABASE_URL: postgresql://ipc:ipc@127.0.0.1:5432/ipc_test
      IPC_DATABASE_URL: postgresql://ipc:ipc@127.0.0.1:5432/ipc_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docker]"

      - name: Install native PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql

      - name: Run tests with branch coverage
        run: python -m pytest -q --require-postgres --cov=backend --cov-branch --cov-report=term-missing --cov-report=json --junitxml=data/exports/pytest-ci.xml

      - name: Enforce architectural coverage floors
        run: python scripts/check_coverage.py

      - name: Verify temporary PostgreSQL isolation
        run: |
          native_postgres_ctl="$(pg_config --bindir)/pg_ctl"
          test -x "$native_postgres_ctl"
          env -u IPC_TEST_DATABASE_URL -u IPC_DATABASE_URL IPC_TEST_POSTGRES_EXECUTABLE="$native_postgres_ctl" \
            python -m pytest -q --require-postgres tests/test_postgres_isolation.py tests/test_goal_intent_postgres.py tests/test_ops_stream.py tests/test_competition_monitor.py tests/test_competition_migration_smoke.py

      - name: Upload test and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-tests-coverage
          path: |
            coverage.json
            data/exports/pytest-ci.xml
            data/exports/pentest

  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package build dependencies
        run: python -m pip install -e ".[docker]" build
      - name: Verify installed platform workflows
        run: python scripts/check_workflow_package.py

  task-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build task image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/member/Dockerfile
          tags: ipc-task:ci
          load: true
          build-args: |
            GITHUB_MIRROR=https://github.com
          cache-from: type=gha,scope=task-image
          cache-to: type=gha,scope=task-image,mode=max

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docker]"

      - name: Run task-image acceptance
        run: docker run --rm --network none -v "$PWD/scripts:/acceptance:ro" ipc-task:ci bash /acceptance/task_image_acceptance.sh

      - name: Run task-image CLI E2E
        run: docker run --rm --network none -v "$PWD/scripts:/acceptance:ro" ipc-task:ci bash /acceptance/task_image_e2e.sh

      - name: Run Docker integration test
        env:
          IPC_TEST_TASK_IMAGE: ipc-task:ci
        run: python -m pytest -q tests/test_task_image_e2e.py --require-docker

      - name: Run AI CPU smoke
        run: docker run --rm -v "$PWD/scripts:/acceptance:ro" ipc-task:ci python3 /acceptance/ai_smoke.py

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IPC_INSTALL_WSRX: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start deterministic E2E stack
        run: |
          docker compose build ipc-app
          docker compose -f docker-compose.e2e.yml up -d e2e-postgres e2e-platform e2e-app

      - name: Run Playwright competition and WP acceptance
        run: docker compose -f docker-compose.e2e.yml run --rm e2e-runner

      - name: Collect E2E stack logs
        if: always()
        run: |
          mkdir -p data/exports/e2e
          sudo chown -R "$(id -u):$(id -g)" data/exports/e2e
          docker compose -f docker-compose.e2e.yml ps -a > data/exports/e2e/compose-status.txt
          docker compose -f docker-compose.e2e.yml logs --no-color > data/exports/e2e/compose.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipc-e2e-diagnostics
          path: data/exports/e2e

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  required-checks:
    if: always()
    needs: [lint, test, package-smoke, task-image, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python -c "import json,os; results=json.loads(os.environ['JOB_RESULTS']); assert all(job['result']=='success' for job in results.values()), results"
